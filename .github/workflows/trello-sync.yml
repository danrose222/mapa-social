name: Sincronizacion con Trello

on:
  pull_request:
    types: [opened, closed]

jobs:
  sync-trello:
    runs-on: ubuntu-latest
    steps:
      # Se usa github-script (contexto de Node) para leer el cuerpo del PR
      # en vez de interpolarlo directamente en un script de shell, evitando
      # así cualquier riesgo de inyección de comandos.
      - name: Extraer ID de tarjeta de Trello
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const match = body.match(/trello\.com\/c\/([a-zA-Z0-9]+)/i);
            if (!match) {
              core.info('No se encontró un enlace de Trello en la descripción del PR. Se omite la sincronización.');
              core.setOutput('card_id', '');
              return;
            }
            core.setOutput('card_id', match[1]);

      - name: Mover tarjeta a "Revisión" (PR abierto)
        if: github.event.action == 'opened' && steps.extract.outputs.card_id != ''
        env:
          CARD_ID: ${{ steps.extract.outputs.card_id }}
          TRELLO_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          LIST_ID: ${{ secrets.TRELLO_LIST_REVIEW_ID }}
        run: |
          curl -s -X PUT "https://api.trello.com/1/cards/${CARD_ID}" \
            --data-urlencode "idList=${LIST_ID}" \
            --data-urlencode "key=${TRELLO_KEY}" \
            --data-urlencode "token=${TRELLO_TOKEN}"

      - name: Mover tarjeta a "Terminado" (PR mergeado)
        if: github.event.action == 'closed' && github.event.pull_request.merged == true && steps.extract.outputs.card_id != ''
        env:
          CARD_ID: ${{ steps.extract.outputs.card_id }}
          TRELLO_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          LIST_ID: ${{ secrets.TRELLO_LIST_DONE_ID }}
        run: |
          curl -s -X PUT "https://api.trello.com/1/cards/${CARD_ID}" \
            --data-urlencode "idList=${LIST_ID}" \
            --data-urlencode "key=${TRELLO_KEY}" \
            --data-urlencode "token=${TRELLO_TOKEN}"
