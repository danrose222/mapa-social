name: Trello Sync

# ---------------------------------------------------------------------------
# Objetivo: cuando un Pull Request se fusiona (merge) a "main", buscar un
# enlace de Trello dentro de la descripción del PR y mover esa tarjeta a la
# lista "Terminado" usando la API REST de Trello (sin Power-Ups de Trello).
# ---------------------------------------------------------------------------

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  move-trello-card:
    # "closed" se dispara tanto si se mergea como si se cierra sin mergear.
    # Este filtro asegura que SOLO corra cuando el PR realmente fue fusionado.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------
      # Paso 1: Extraer el ID de la tarjeta de Trello desde el body del PR.
      # Buscamos una URL con el formato https://trello.com/c/<cardId>/...
      # y la exponemos como output para el siguiente paso.
      # -----------------------------------------------------------------
      - name: Extraer ID de tarjeta de Trello desde el body del PR
        id: extract_card
        # El body del PR se pasa como variable de entorno (PR_BODY) en vez de
        # interpolarse directamente en el script. Interpolar `${{ github.event.pull_request.body }}`
        # dentro del bloque `run` permitiría inyección de comandos si alguien
        # escribe algo como `$(comando)` o backticks en la descripción del PR.
        # Usando env + "$PR_BODY" (entre comillas), el contenido se trata
        # siempre como texto plano, nunca como código de shell.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Busca la primera URL de Trello con formato /c/<cardId>
          CARD_ID=$(echo "$PR_BODY" | grep -oE 'trello\.com/c/[A-Za-z0-9]+' | head -n 1 | cut -d'/' -f3)

          if [ -z "$CARD_ID" ]; then
            echo "No se encontró un enlace de Trello en la descripción del PR. Se omite la sincronización."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tarjeta de Trello detectada: $CARD_ID"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "card_id=$CARD_ID" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------
      # Paso 2: Mover la tarjeta a la lista "Terminado" vía API de Trello.
      # Usa el endpoint PUT /1/cards/{id} para actualizar el campo idList.
      # La autenticación de Trello se hace por query string (key + token),
      # ambos tomados de GitHub Secrets, nunca hardcodeados en el archivo.
      # -----------------------------------------------------------------
      - name: Mover tarjeta a la lista "Terminado" en Trello
        if: steps.extract_card.outputs.found == 'true'
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_API_TOKEN: ${{ secrets.TRELLO_API_TOKEN }}
          TRELLO_LIST_ID_TERMINADO: ${{ secrets.TRELLO_LIST_ID_TERMINADO }}
          CARD_ID: ${{ steps.extract_card.outputs.card_id }}
        run: |
          curl --fail --silent --show-error -X PUT \
            "https://api.trello.com/1/cards/${CARD_ID}?idList=${TRELLO_LIST_ID_TERMINADO}&key=${TRELLO_API_KEY}&token=${TRELLO_API_TOKEN}"

# ---------------------------------------------------------------------------
# CONFIGURACIÓN MANUAL REQUERIDA (GitHub > Settings > Secrets and variables
# > Actions > New repository secret). Debes crear estos 3 secrets:
#
# 1) TRELLO_API_KEY
#    - Qué es: tu API Key personal de Trello (identifica a la app/integración).
#    - Dónde obtenerla: https://trello.com/app-key estando logueado.
#
# 2) TRELLO_API_TOKEN
#    - Qué es: un token de autorización que le da a tu API Key permiso para
#      actuar en nombre de tu cuenta (leer/escribir tarjetas).
#    - Dónde obtenerlo: en la misma página de la API key hay un link para
#      generar un token. Debe autorizarse con permisos de escritura
#      (read + write) para poder mover tarjetas entre listas.
#    - Importante: trátalo como una contraseña; no expira por defecto salvo
#      que la configures al generarlo.
#
# 3) TRELLO_LIST_ID_TERMINADO
#    - Qué es: el ID interno (no el nombre) de la lista "Terminado" dentro
#      del tablero https://trello.com/b/kOIJhXkp/mapa-social-desarrollo.
#    - Cómo obtenerlo: agregar ".json" a la URL del tablero y buscar, dentro
#      del array "lists", el objeto cuyo "name" sea "Terminado"; copiar su
#      campo "id" (ver instrucciones detalladas impresas en terminal).
#
# Ninguno de estos valores debe escribirse directamente en este archivo:
# se leen exclusivamente desde `secrets.*` en tiempo de ejecución para que
# no queden expuestos en el repositorio ni en los logs del workflow.
# ---------------------------------------------------------------------------
