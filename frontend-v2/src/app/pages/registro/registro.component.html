<div class="auth">
  <div class="card auth__card">
    <a routerLink="/" class="auth__back">
      <app-icon name="arrowLeft" [size]="14" />
      Volver al mapa
    </a>

    <h1>Creá tu cuenta</h1>
    <p class="auth__lead">Sin restricción de rol: cualquiera puede publicar una necesidad.</p>

    @if (errorMessage()) {
      <p class="auth__alert">{{ errorMessage() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="auth__row">
        <div class="field">
          <label for="reg-first">Nombre</label>
          <input id="reg-first" type="text" formControlName="firstName" autocomplete="given-name" />
        </div>

        <div class="field">
          <label for="reg-last">Apellido</label>
          <input id="reg-last" type="text" formControlName="lastName" autocomplete="family-name" />
        </div>
      </div>

      <div class="field">
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" formControlName="email" autocomplete="email" />
      </div>

      <div class="field">
        <label for="reg-phone">Teléfono (opcional)</label>
        <input id="reg-phone" type="tel" formControlName="phone" autocomplete="tel" />
      </div>

      <div class="field">
        <label for="reg-password">Contraseña</label>
        <input
          id="reg-password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
        />
      </div>

      <button type="submit" class="btn btn--block" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Creando cuenta…' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="auth__switch">¿Ya tenés cuenta? <a routerLink="/entrar">Iniciá sesión</a></p>
  </div>
</div>
