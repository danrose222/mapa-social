version: "3.8"

services:

  db:
    image: mysql:8.0
    container_name: mapa_social_db_dev

    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: mapa_social
      MYSQL_USER: ${DB_USER:-mapa_user}
      MYSQL_PASSWORD: ${DB_PASS:-mapa_password}

    ports:
      - "3306:3306"

    volumes:
      - db_data_dev:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    restart: unless-stopped

  backend:

    build:
      context: ./backend
      dockerfile: Dockerfile.dev

    container_name: mapa_social_backend_dev

    working_dir: /app

    volumes:
      - ./backend:/app
      - /app/node_modules

    ports:
      - "3000:3000"

    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-mapa_user}
      DB_PASS: ${DB_PASS:-mapa_password}
      DB_NAME: mapa_social
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_FROM: "Mapa Social <no-responder@mapasocial.local>"
      APP_URL: http://localhost:8080

    depends_on:
      - db
      - mailhog

    restart: unless-stopped

  # Servidor SMTP falso para desarrollo: ver el comentario equivalente en
  # docker-compose.yml.
  mailhog:
    image: mailhog/mailhog
    container_name: mapa_social_mailhog_dev
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  frontend:

    build:
      context: ./frontend

    container_name: mapa_social_frontend_dev

    ports:
      - "8080:8080"

    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  db_data_dev: