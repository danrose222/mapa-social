@if (previewUrl()) {
  <div class="image-upload__preview">
    <img [src]="previewUrl()" alt="Vista previa de la imagen" />

    @if (isUploading()) {
      <div class="image-upload__overlay">Subiendo…</div>
    }

    @if (!isUploading()) {
      <button type="button" class="image-upload__remove" (click)="removeImage()">
        Quitar imagen ✕
      </button>
    }
  </div>
} @else {
  <label class="image-upload__dropzone">
    <input type="file" accept="image/jpeg,image/png,image/webp,image/gif" (change)="onFileSelected($event)" />
    <span class="image-upload__dropzone-icon">📷</span>
    <span>Agregar una foto (opcional)</span>
    <span class="image-upload__hint">JPG, PNG, WEBP o GIF — hasta 5MB</span>
  </label>
}

@if (errorMessage()) {
  <p class="image-upload__error">{{ errorMessage() }}</p>
}
