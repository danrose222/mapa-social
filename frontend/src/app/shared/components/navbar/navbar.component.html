<mat-toolbar color="primary" class="navbar">
  <button
    mat-icon-button
    type="button"
    class="menu-toggle"
    aria-label="Abrir menú de navegación"
    (click)="toggleMenu()"
  >
    <mat-icon>{{ isMenuOpen ? 'close' : 'menu' }}</mat-icon>
  </button>

  <a class="brand" routerLink="/" (click)="closeMenu()">Mapa Social</a>

  <span class="spacer"></span>

  <a
    mat-button
    class="nav-link"
    routerLink="/"
    routerLinkActive="active-link"
    [routerLinkActiveOptions]="{ exact: true }"
  >
    Inicio
  </a>

  <a
    mat-button
    class="nav-link"
    routerLink="/mapa"
    routerLinkActive="active-link"
  >
    Mapa
  </a>

  <a
    mat-button
    class="nav-link"
    routerLink="/registrar-necesidad"
    routerLinkActive="active-link"
  >
    Registrar necesidad
  </a>

  <a
    mat-button
    class="nav-link"
    routerLink="/ofrecer-recurso"
    routerLinkActive="active-link"
  >
    Ofrecer recurso
  </a>

  @if (currentUser()) {
    <button
      mat-button
      type="button"
      class="login-link"
      (click)="logout()"
    >
      Cerrar sesión
    </button>
  } @else {
    <a
      mat-button
      class="login-link"
      routerLink="/login"
      routerLinkActive="active-link"
      (click)="closeMenu()"
    >
      Login
    </a>
  }
</mat-toolbar>

@if (isMenuOpen) {
  <div
    class="mobile-menu-backdrop"
    (click)="closeMenu()"
  ></div>

  <nav class="mobile-menu">
    <a
      class="mobile-menu-link"
      routerLink="/"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
    >
      Inicio
    </a>

    <a
      class="mobile-menu-link"
      routerLink="/mapa"
      routerLinkActive="active-link"
      (click)="closeMenu()"
    >
      Mapa
    </a>

    <a
      class="mobile-menu-link"
      routerLink="/registrar-necesidad"
      routerLinkActive="active-link"
      (click)="closeMenu()"
    >
      Registrar necesidad
    </a>

    <a
      class="mobile-menu-link"
      routerLink="/ofrecer-recurso"
      routerLinkActive="active-link"
      (click)="closeMenu()"
    >
      Ofrecer recurso
    </a>
  </nav>
}
