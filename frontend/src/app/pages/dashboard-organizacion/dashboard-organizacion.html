 
<div class="dashboard-container">
    <!-- Información del perfil -->
    @if (authService.profile(); as profile) {
      <header class="dashboard-header">
        <h1>Hola, {{ profile.firstName }}!</h1>
        <p class="org-name">
          Organización: <strong>{{ profile.organization?.name || 'Sin asignar' }}</strong>
        </p>
      </header>
    }
  
    <!-- Mensaje sobre el estado de aval o permisos -->
    <div class="status-card">
      <p>{{ authService.resourcePublishReason() }}</p>
    </div>
  
    <!-- Botones y paneles dinámicos -->
    <div class="actions">
      @if (authService.canPublishResource()) {
        <button class="btn btn-primary">
          + Crear Nuevo Recurso
        </button>
      } @else {
        <button class="btn btn-disabled" disabled>
          Crear Nuevo Recurso (Pendiente de Aval)
        </button>
      }
    </div>
  </div>
