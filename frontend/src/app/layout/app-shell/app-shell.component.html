<header class="shell-header">
  <a routerLink="/" class="shell-header__brand" (click)="closeMenu()">
    <app-icon name="heart" [size]="20" [filled]="true" />
    Mapa Social
  </a>

  <nav class="shell-header__nav" [class.shell-header__nav--open]="isMenuOpen()">
    <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
      Inicio
    </a>

    <a routerLink="/mapa" routerLinkActive="is-active" (click)="closeMenu()">
      Mapa
    </a>

    <a routerLink="/publicar/quiero-ayudar" routerLinkActive="is-active" (click)="closeMenu()">
      Quiero ayudar
    </a>

    <a routerLink="/quienes-somos" routerLinkActive="is-active" (click)="closeMenu()">
      Quiénes somos
    </a>

    @if (currentUser()) {
      <div class="shell-account">
        <button
          type="button"
          class="shell-account__trigger"
          (click)="toggleAccountMenu($event)"
          [attr.aria-expanded]="isAccountMenuOpen()"
        >
          <app-icon name="user" [size]="15" />
          {{ currentUser()?.firstName }}
          <app-icon name="chevronDown" [size]="13" />
        </button>

        <div
          class="shell-account__panel"
          [class.shell-account__panel--open]="isAccountMenuOpen()"
          (click)="$event.stopPropagation()"
        >
          @if (dashboardUrl(); as url) {
            <a [routerLink]="url" routerLinkActive="is-active" (click)="closeMenu()">
              Mi panel
            </a>
          }

          <a routerLink="/mis-publicaciones" routerLinkActive="is-active" (click)="closeMenu()">
            Mis publicaciones
          </a>

          <a routerLink="/mis-solicitudes" routerLinkActive="is-active" (click)="closeMenu()">
            Mis solicitudes
          </a>

          <a routerLink="/organizacion/mi-organizacion" routerLinkActive="is-active" (click)="closeMenu()">
            Mi organización
          </a>

          @if (isModerator()) {
            <span class="shell-account__label">Moderación</span>

            <a routerLink="/moderador/publicaciones" routerLinkActive="is-active" (click)="closeMenu()">
              Publicaciones
            </a>

            <a routerLink="/moderador/organizaciones" routerLinkActive="is-active" (click)="closeMenu()">
              Organizaciones
            </a>

            <a routerLink="/moderador/mis-localidades" routerLinkActive="is-active" (click)="closeMenu()">
              Mis localidades
            </a>

            <a routerLink="/estadisticas" routerLinkActive="is-active" (click)="closeMenu()">
              Estadísticas
            </a>
          }

          <span class="shell-account__divider" aria-hidden="true"></span>

          <button type="button" class="shell-account__logout" (click)="logout()">
            Cerrar sesión
          </button>
        </div>
      </div>
    } @else {
      <a routerLink="/entrar" class="shell-header__cta" (click)="closeMenu()">Entrar</a>
    }
  </nav>

  <button
    type="button"
    class="shell-header__hamburger"
    (click)="toggleMenu()"
    [attr.aria-expanded]="isMenuOpen()"
    aria-label="Abrir menú"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

<main class="shell-main">
  <router-outlet />
</main>
