version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: mapa_social_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: mapa_social
      MYSQL_USER: ${DB_USER:-mapa_user}
      MYSQL_PASSWORD: ${DB_PASS:-mapa_password}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
    container_name: mapa_social_backend
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-mapa_user}
      - DB_PASS=${DB_PASS:-mapa_password}
      - DB_NAME=mapa_social
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES=${JWT_EXPIRES:-7d}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: mapa_social_frontend
    ports:
      - "80:8080"
    depends_on:
      - backend
    restart: unless-stopped

  # Nuevo: segundo frontend (prototipo), mismo backend, puerto aparte.
  frontend-v2:
    build:
      context: ./frontend-v2
    container_name: mapa_social_frontend_v2
    ports:
      - "90:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  backend_uploads:
